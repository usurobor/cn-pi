# How far Pi home has read per r0 box. An INDEX, never a log.
#
# cnos#690 §4: one record each {repo, ref, last_read_sha}, nothing else.
# A poll that finds nothing new updates last_read_sha and writes NOTHING else.
# If this file ever grows a notes:/history: field carrying walk prose, it has
# become the thing #690 exists to prevent.
#
# STATUS 2026-08-03: the r0 boxes below are NOT yet materialized in git. They
# exist today only as Google Drive hot-staging documents (see drive_doc). The
# pi-host bridge will commit each to its writer-owned orphan ref; until then
# last_read_sha is `pending` and the first rollup (reflections/r1/r1-20260803.md)
# is provisional — it cites Drive revisions, not SHAs, and must be regenerated
# once the boxes land in git.

